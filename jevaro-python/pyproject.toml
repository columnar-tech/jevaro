[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jevaro"
version = "0.1.1"
description = "Send batches of states to Jev and read the answers as Arrow"
readme = "README.md"
authors = [{name = "Columnar Technologies Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["typesafe-sdk==0.7.2", "httpx2>=2.13,<3", "pyarrow==25.0.1"]

[project.urls]
Homepage = "https://github.com/columnar-tech/jevaro"
Documentation = "https://github.com/columnar-tech/jevaro/blob/main/jevaro-python/README.md"
Repository = "https://github.com/columnar-tech/jevaro"
Issues = "https://github.com/columnar-tech/jevaro/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevaro = ["py.typed"]
