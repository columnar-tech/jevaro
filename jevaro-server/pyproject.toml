[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jevaro-server"
version = "0.1.1"
description = "Evaluate batches of states with Jev and stream Arrow results"
readme = "README.md"
authors = [{name = "Columnar Technologies Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "typesafe-sdk==0.7.2",
  "pyarrow==25.0.1",
]

[project.urls]
Homepage = "https://github.com/columnar-tech/jevaro"
Documentation = "https://github.com/columnar-tech/jevaro/blob/main/jevaro-server/README.md"
Repository = "https://github.com/columnar-tech/jevaro"
Issues = "https://github.com/columnar-tech/jevaro/issues"

[project.scripts]
jevaro-server = "jevaro_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
