name: npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'columnar-tech/jevaro' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    name: Publish jevaro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish to npm
        run: npm publish ./dist/jevaro-*.tgz --access public --ignore-scripts
